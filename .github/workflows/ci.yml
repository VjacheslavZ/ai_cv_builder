name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No ANTHROPIC_API_KEY anywhere: tests use the fake LLM client (docs/plans/testing.md).
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall builds packages/shared and generates the Prisma client.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      - run: pnpm test:unit

      # Testcontainers starts postgres:16 and redis:7 on the runner's Docker.
      - run: pnpm test:int
